# Serves the built UI and proxies the API, so the browser sees one origin (no CORS).
server {
    listen 8080;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://recon-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Hashed asset names change on every build, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single-page app: any other path (e.g. a shared link with ?break=42) serves index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
