# Matching tolerances per asset class. Shared by recon-datagen (to inject harmless noise and
# out-of-tolerance breaks) and, from stage 2, by the matcher.
#
# Effective tolerance = max(abs, |expected| * bps / 10,000). A difference equal to the
# tolerance counts as within tolerance.

tolerance.EQUITY.price.abs=0.005
tolerance.EQUITY.price.bps=2
tolerance.EQUITY.netAmount.abs=0.05
tolerance.EQUITY.netAmount.bps=2
tolerance.EQUITY.commission.abs=0.01

# Bond prices are quoted as a percentage of face value, so the absolute price band is tighter.
tolerance.FIXED_INCOME.price.abs=0.001
tolerance.FIXED_INCOME.price.bps=1
tolerance.FIXED_INCOME.netAmount.abs=0.05
tolerance.FIXED_INCOME.netAmount.bps=1
tolerance.FIXED_INCOME.commission.abs=0.01
