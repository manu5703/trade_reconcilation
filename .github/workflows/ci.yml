name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build

      - name: Smoke-test the data generator
        run: ./gradlew :recon-datagen:run --args="--trades 2000 --seed 42 --out build/ci-data"

      - name: Score the matcher against the labels
        run: ./gradlew :recon-datagen:score --args="--data build/ci-data --repeat 1"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"

  docker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: recon-service/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
